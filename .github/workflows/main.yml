name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurer JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Détecter automatiquement le répertoire racine du projet Gradle
      - name: Locate Gradle project root
        id: locate
        run: |
          echo "🔍 Recherche de settings.gradle..."
          SETTINGS=$(find . -name "settings.gradle*" -not -path "*/build/*" -not -path "*/.gradle/*" | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "❌ Aucun settings.gradle trouvé dans le dépôt."
            echo "Contenu du dépôt :"
            ls -la
            exit 1
          fi
          ROOT_DIR=$(dirname "$SETTINGS")
          echo "✅ Projet Gradle trouvé dans : $ROOT_DIR"
          echo "root_dir=$ROOT_DIR" >> $GITHUB_OUTPUT

      # 4. Vérifier la présence du wrapper Gradle, sinon le générer
      - name: Ensure Gradle wrapper exists
        working-directory: ${{ steps.locate.outputs.root_dir }}
        run: |
          if [ ! -f "gradlew" ]; then
            echo "⚠️ gradlew absent, génération via gradle wrapper..."
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew
          echo "✅ Wrapper prêt."

      # 5. Compiler l'APK de debug
      - name: Build Debug APK
        working-directory: ${{ steps.locate.outputs.root_dir }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # 6. Uploader l'APK de debug
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ steps.locate.outputs.root_dir }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # 7. (Optionnel) Compiler l'APK de release si un tag v* est poussé
      - name: Build Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: ${{ steps.locate.outputs.root_dir }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: ${{ steps.locate.outputs.root_dir }}/**/build/outputs/apk/release/*.apk
          if-no-files-found: error
