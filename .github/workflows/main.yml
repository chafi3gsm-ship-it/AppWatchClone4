name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # Utiliser l'action officielle pour installer automatiquement Gradle, sans dépendre du fichier gradlew
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    # Appeler directement gradle, sans le préfixe ./
    - name: Build Debug APK
      run: gradle assembleDebug

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/*.apk

    # La compilation Release nécessite une configuration de signature, décommentez et remplissez les secrets si nécessaire
    # - name: Build Release APK
    #   run: gradle assembleRelease
